    transition:width .35s ease}

  .page{animation:fade .35s ease}

  p{margin:.7rem 0}
  .lead{font-size:1.12rem;color:#dfe4ef}
  .muted{color:var(--dim)}
  .small{font-size:.85rem}

    color:var(--gold);font-weight:700;margin-bottom:6px}
  .verse .text{font-family:var(--serif);font-size:1.18rem;line-height:1.65}

  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
  .box h3{margin:0 0 .4rem;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-family:var(--sans)}
  .box.think h3{color:var(--gold2)}
  .box.do h3{color:var(--green)}
  .box.deeper h3{color:#c9a6ff}

  .center{text-align:center}
  .hero{padding:40px 0 10px}
  .hero .t{font-family:var(--serif);font-size:2.6rem;line-height:1.1;letter-spacing:-.02em}
  .hero .s{color:var(--dim);margin-top:12px;font-size:1.05rem}

  .nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(0deg,#0f1117 60%,rgba(15,17,23,.85));

    font:inherit;font-weight:700;padding:.75rem 1.3rem;cursor:pointer;flex:1}

  textarea{min-height:96px;resize:vertical;font-family:var(--serif);font-size:1.02rem;line-height:1.6}
  label{display:block;font-size:.8rem;color:var(--dim);margin:.7rem 0 .3rem}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
  .dots b{width:7px;height:7px;border-radius:50%;background:#2c3348}
  .dots b.on{background:var(--gold)}
  .dots b.seen{background:#4a5470}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#232941;border:1px solid var(--line);

  ul{margin:.5rem 0;padding-left:1.2rem}
  li{margin:.35rem 0}

    padding:16px 18px;font-family:var(--serif);font-size:1.1rem;line-height:1.7}
</style>
</head>

/* ================= STATE ================= */
var KEY="starthere_v1";
var DB=load();
var idx=0, showingWelcome=true;
function load(){ try{var r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return {name:"", done:{}, notes:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m];}); }

/* ================= RENDER ================= */
var view=document.getElementById("view");
var navIn=document.getElementById("navIn");

function verseBlock(ref){
  var t=VERSES[ref];
  if(!t) return "";
  return '<div class="verse"><div class="ref">'+esc(ref.toUpperCase())+'</div><div class="text">'+esc(t)+'</div></div>';
}

function totalPages(){ return LESSONS.length+2; } // welcome + lessons + closing
function currentPage(){ return showingWelcome?0:idx+1; }

function render(){
  document.getElementById("whoName").textContent = DB.name?DB.name:"";
  document.getElementById("prog").style.width = Math.round(100*currentPage()/(totalPages()-1))+"%";
  if(showingWelcome){ view.innerHTML=welcome(); wireWelcome(); }
  else if(idx<LESSONS.length){ view.innerHTML=lessonPage(LESSONS[idx]); wireLesson(); }
  else { view.innerHTML=closing(); wireClosing(); }
  window.scrollTo(0,0);
}

function welcome(){
  return '<div class="page hero">'
  +'<div class="kicker">Start here</div>'
  +'<div class="t">Do you want to know God?</div>'
  +'<div class="s">A short journey in 15 steps. No pressure, no jargon, no church background needed. '
  +'Just you, an open Bible, and the truth.</div>'
  +'</div>'
  +'<div class="box">'
  +'<h3>Before you begin</h3>'
  +'<p class="small">Take this at your own pace — one page at a time. Read the verse slowly. '
  +'Think about the question. Do the one small thing at the end. That is all.</p>'
  +'<label>Your name (so we can keep your progress)</label>'
  +'<input id="nm" placeholder="Type your name" value="'+esc(DB.name)+'" autocomplete="off">'
  +'</div>'
  +'<div class="box think"><h3>A prayer before we start</h3>'
  +'<p class="big">\u201cGod, I do not know everything. But I am willing to look. Show me who You are. Amen.\u201d</p></div>';
}
function wireWelcome(){
  var i=document.getElementById("nm");
  i.addEventListener("input",function(){ DB.name=i.value.trim(); save(); document.getElementById("whoName").textContent=DB.name; });
}

function lessonPage(L){
  var n=LESSONS.indexOf(L)+1;
  var dots=LESSONS.map(function(_,i){ return '<b class="'+(i<idx?"seen":(i===idx?"on":""))+'"></b>'; }).join("");
  return '<div class="page">'
  +'<div class="kicker">'+esc(L.kicker)+'</div>'
  +'<h1>'+esc(L.title)+'</h1>'
  +'<p class="lead">'+esc(L.lead)+'</p>'
  + verseBlock(L.verse)
  +'<div class="box"><h3>What this means</h3><p>'+esc(L.meaning)+'</p></div>'
  + (L.verses2&&L.verses2.length?'<div class="box"><h3>Read also</h3>'+L.verses2.map(verseBlock).join("")+'</div>':'')
  + (L.prayer?'<div class="box do"><h3>Pray this</h3><div class="prayer">'+esc(L.prayer)+'</div></div>':'')
  +'<div class="box think"><h3>Think about it</h3><p>'+esc(L.think)+'</p></div>'
  +'<div class="box do"><h3>Do this today</h3><p>'+esc(L.action)+'</p></div>'
  +'<div class="box"><h3>Your notes</h3>'
  +'<label>Write what God is showing you on this page</label>'
  +'<textarea id="note" placeholder="My thoughts...">'+esc(DB.notes[n]||"")+'</textarea>'
  +'<button class="btn gold" id="saveNote" style="margin-top:10px">Save my note</button></div>'
  +'<div class="dots">'+dots+'</div>'
  +'</div>';
}
function wireLesson(){
  var t=document.getElementById("note");
  if(t) t.addEventListener("input",function(){ DB.notes[LESSONS.indexOf(LESSONS[idx])+1]=t.value; save(); });
  var b=document.getElementById("saveNote");
  if(b) b.onclick=function(){ DB.notes[idx+1]=document.getElementById("note").value; DB.done[idx]=true; save(); toast("Saved. Keep going."); };
}

function closing(){
  return '<div class="page">'
  +'<div class="kicker">You made it</div>'
  +'<h1>Where to go from here</h1>'
  +'<p class="lead">You have walked through the whole story: God made you, sin broke us, Jesus saved us, '
  +'and now you are sent. Here is how to keep going — so your faith grows strong and does not fade.</p>'
  +'<div class="box"><h3>Four habits that keep you standing</h3><ul>'
  +'<li><b>Read</b> — one chapter a day. Start with the Gospel of John.</li>'
  +'<li><b>Pray</b> — talk to God like a Father, every day, in your own words.</li>'
  +'<li><b>Gather</b> — join a Bible-believing church and a small group this week.</li>'
  +'<li><b>Tell</b> — share your story with one person who needs to hear it.</li>'
  +'</ul></div>'
  +'<div class="box do"><h3>If you prayed the prayer in Lesson 6</h3>'
  +'<p>Welcome to the family of God. Nothing can separate you from His love. When you fail — and you will — '
  +'you are not disqualified. You are a child being taught to walk. Get up, and keep walking with Him.</p></div>'
  +'<div class="box"><h3>Walk with others</h3>'
  +'<p class="small">Faith grows in company. Ask your questions, share what you are learning, and encourage one another.</p>'
  +'<div class="chips">'
  +'<a href="https://chat.whatsapp.com/" target="_blank" rel="noopener">WhatsApp group</a>'
  +'<a href="https://t.me/" target="_blank" rel="noopener">Telegram group</a>'
  +'<a href="https://www.facebook.com/groups/" target="_blank" rel="noopener">Facebook group</a>'
  +'<a href="https://www.youtube.com/" target="_blank" rel="noopener">Watch teaching</a>'
  +'</div><p class="small muted" style="margin-top:8px">Set your church\u2019s own links in the file (see COMMUNITY).</p></div>'
  +'<div class="box"><h3>Your notes so far</h3>'
  +(Object.keys(DB.notes).filter(function(k){return DB.notes[k];}).length
    ? Object.keys(DB.notes).filter(function(k){return DB.notes[k];}).sort(function(a,b){return a-b;}).map(function(k){
        return '<p class="small"><b>Lesson '+esc(k)+':</b> '+esc(DB.notes[k])+'</p>';
      }).join("")
    : '<p class="small muted">No notes yet — go back and write as you read.</p>')
  +'</div>'
  +'<div class="box center"><h3>About</h3><p class="small">START HERE · Knowing God — a short course for those seeking God.</p>'
  +'<p class="small">GitHub: <a href="https://github.com/MAYI12333" target="_blank" rel="noopener" style="color:var(--blue)">github.com/MAYI12333</a></p>'
  +'<p class="small muted">Offline single file. No server. Nothing leaves your device.</p></div>'
  +'</div>';
}
function wireClosing(){}

/* ================= NAV ================= */
function drawNav(){
  if(showingWelcome){
    navIn.innerHTML='<button class="btn gold" id="startBtn">Begin the journey \u2192</button>';
    document.getElementById("startBtn").onclick=function(){ showingWelcome=false; idx=0; render(); drawNav(); };
    return;
  }
  var back='<button class="btn ghost" id="backBtn">\u2190 Back</button>';
  var next;
  if(idx<LESSONS.length-1) next='<button class="btn" id="nextBtn">Next \u2192</button>';
  else if(idx===LESSONS.length-1) next='<button class="btn" id="nextBtn">Finish \u2192</button>';
  else next='<button class="btn ghost" id="backBtn2">\u2190 Back to lessons</button>';
  navIn.innerHTML=back+next;
  var b=document.getElementById("backBtn");
  if(b) b.onclick=function(){ if(idx===0){ showingWelcome=true; } else { idx--; } render(); drawNav(); };
  var n=document.getElementById("nextBtn");
  if(n) n.onclick=function(){ DB.done[idx]=true; save(); idx++; render(); drawNav(); };
  var b2=document.getElementById("backBtn2");
  if(b2) b2.onclick=function(){ idx=LESSONS.length-1; render(); drawNav(); };
}

var toastT;
function toast(m){ var el=document.getElementById("toast"); el.textContent=m; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},1700); }

render(); drawNav();
</script>
</body>
</html>
