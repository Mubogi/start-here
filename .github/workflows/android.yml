name: Build Android APK

# Builds an installable debug APK in the cloud, so you do not need
# Android Studio on your own computer.
#
# Run it: GitHub repo -> Actions -> "Build Android APK" -> Run workflow.
# Then download the "start-here-apk" artifact from the run.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "courses/**"
      - "shared/**"
      - "build.js"
      - "android-app/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the standalone course page
        run: |
          node build.js
          ls -la dist

      - name: Prepare the Android SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Create the Android project
        working-directory: android-app
        run: |
          mkdir -p www
          cp ../dist/start-here-new-believer.html www/index.html
          npm install
          npx cap add android
          npx cap sync android

      - name: Build the debug APK
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: start-here-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
